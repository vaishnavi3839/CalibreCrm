# Production stack — web app ready to host
# Usage:
#   cp .env.production.example .env.production
#   # edit secrets in .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calibre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calibre_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calibre} -d ${POSTGRES_DB:-calibre_crm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Calibre Aviation Academy CRM}
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calibre}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calibre_crm}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-calibre}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calibre_crm}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL:-${FRONTEND_URL}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROOMING_VISION_MODEL: ${GROOMING_VISION_MODEL:-gemini-flash-latest}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  uploads_data:
